version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./database/app.db
      - UPLOAD_DIR=./uploads
    volumes:
      - ./uploads:/app/uploads:Z
      - ./database:/app/database:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - virtual-prototype-network
    security_opt:
      - label=disable

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - virtual-prototype-network
    security_opt:
      - label=disable

  # Optional: Database service for production
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=virtual_prototype
      - POSTGRES_USER=vpuser
      - POSTGRES_PASSWORD=vppassword
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpuser -d virtual_prototype"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - virtual-prototype-network
    profiles:
      - production
    security_opt:
      - label=disable

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - virtual-prototype-network
    profiles:
      - production
    security_opt:
      - label=disable

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:Z
      - ./nginx/ssl:/etc/nginx/ssl:Z
    depends_on:
      - backend
      - frontend
    networks:
      - virtual-prototype-network
    profiles:
      - production
    security_opt:
      - label=disable

volumes:
  postgres_data:
  redis_data:

networks:
  virtual-prototype-network:
    driver: bridge